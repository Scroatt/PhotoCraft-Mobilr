name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "scripts/fetch-web.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/fetch-web.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Instala o Gradle 8.10.2 (o projeto não versiona o gradle-wrapper.jar).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Fetch the PhotoCraft web build
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-web.sh

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
